services:
  postgres:
    image: postgres:14
    container_name: my-postgres
    environment:
      POSTGRES_DB: eventdb
      POSTGRES_USER: eventuser
      POSTGRES_PASSWORD: eventpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck: # Важно: ждем, пока БД будет готова принимать соединения
      test: [ "CMD-SHELL", "pg_isready -U eventuser -d eventdb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: event-hub-app
    ports:
      - "8080:8080"
    environment:
      # Подключаемся к базе по имени сервиса "postgres", а не localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventdb
      SPRING_DATASOURCE_USERNAME: eventuser
      SPRING_DATASOURCE_PASSWORD: eventpassword
      # Задаем секретный ключ для JWT
      JWT_SECRET: my-super-secret-production-key-1234567890
    depends_on:
      postgres:
        condition: service_healthy # Ждем, пока БД пройдет healthcheck

volumes:
  postgres_data: